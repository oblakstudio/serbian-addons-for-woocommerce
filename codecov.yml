# Codecov configuration - https://docs.codecov.com/docs/codecov-yaml
# Reports come from the PHPUnit clover file of the PHP 8.4 jobs (see .github/workflows/tests.yml);
# the files in scope are set by the <coverage> section of phpunit.xml.dist.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flags:
  hpos:
    carryforward: false
  legacy:
    carryforward: false

comment:
  layout: 'condensed_header, diff, flags, files'
  require_changes: true
