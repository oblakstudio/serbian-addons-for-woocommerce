name: Tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducible runs - bump together with the plugin's "tested up to" headers
  # (WooCommerce versions are in the phpunit job matrix: tested up to + the minimum).
  WP_VERSION: '7.1.5'
  SQLITE_VERSION: '3.1.3'

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / ${{ matrix.storage }} storage / WC ${{ matrix.wc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
        storage: ['hpos', 'legacy']
        wc: ['11.3.1']
        include:
          # Coverage of both storages - Codecov merges the flagged reports.
          - php: '8.4'
            storage: 'hpos'
            wc: '11.3.1'
            coverage: true
          - php: '8.4'
            storage: 'legacy'
            wc: '11.3.1'
            coverage: true
          # The minimum WooCommerce version (block checkout fields need 10.8+). Legacy storage: WooCommerce 10.8's
          # HPOS refund query is not supported by the SQLite drop-in, and its error output stalls the
          # separate-process Store API tests. HPOS is covered on the current version above.
          - php: '8.0'
            storage: 'legacy'
            wc: '10.8.1'
    env:
      WC_VERSION: ${{ matrix.wc }}
      WCSRB_TESTS_HPOS: ${{ matrix.storage == 'hpos' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner context is not available in job level env.
      - name: Set test environment directory
        run: echo "WCSRB_TESTS_DIR=${{ runner.temp }}/wcsrb-wp-tests" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, mbstring, pdo_sqlite, sqlite3, zip
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          # pcov only watches lib/ by default - config/ and woocommerce/ templates are in scope too.
          ini-values: pcov.directory=., pcov.exclude="~vendor~"
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Cache WordPress test downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wcsrb-wp-tests/downloads
          key: wp-tests-${{ env.WP_VERSION }}-${{ env.WC_VERSION }}-${{ env.SQLITE_VERSION }}

      - name: Install WordPress test environment
        run: composer test:install

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-text --coverage-clover=.cache/coverage/clover.xml

      - name: Require 100% coverage of the payment gateway code
        if: ${{ matrix.coverage && matrix.storage == 'hpos' }}
        run: php bin/check-coverage.php .cache/coverage/clover.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .cache/coverage/clover.xml
          disable_search: true
          flags: ${{ matrix.storage }}
          name: php-${{ matrix.php }}-${{ matrix.storage }}
          fail_ci_if_error: true

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover-${{ matrix.storage }}
          path: .cache/coverage/clover.xml
