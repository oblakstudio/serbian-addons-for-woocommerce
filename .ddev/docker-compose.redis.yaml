#ddev-generated
volumes:
  redis:
    name: ddev-${DDEV_SITENAME}-redis
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}

services:
  redis:
    container_name: ddev-${DDEV_SITENAME}-redis
    hostname: ddev-${DDEV_SITENAME}-minio
    image: redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: /etc/redis/conf/redis.conf
    volumes:
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
      - "./redis:/etc/redis/conf"
      - "redis:/data"
    expose:
      - 6379
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: "768M"
        reservations:
          cpus: "1.5"
          memory: "512M"
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
